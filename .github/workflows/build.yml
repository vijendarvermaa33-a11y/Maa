name: Build Vijendra Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .android-source
          mkdir -p .android-source

          PROJECT_DIR=""

          # 1) Project already at repository root
          if [[ -f "$GITHUB_WORKSPACE/settings.gradle" && -f "$GITHUB_WORKSPACE/app/build.gradle" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          fi

          # 2) Extract any ZIP in the repository if project is not at root
          if [[ -z "$PROJECT_DIR" ]]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -print -quit || true)"
            if [[ -n "$ZIP_FILE" ]]; then
              echo "Found ZIP: $ZIP_FILE"
              unzip -q "$ZIP_FILE" -d .android-source
            fi
          fi

          # 3) Find the Android root anywhere under workspace
          if [[ -z "$PROJECT_DIR" ]]; then
            PROJECT_DIR="$(find "$GITHUB_WORKSPACE" -type f -name settings.gradle -not -path '*/.git/*' -print0 | while IFS= read -r -d '' f; do
              d="$(dirname "$f")"
              if [[ -f "$d/app/build.gradle" ]]; then
                printf '%s\n' "$d"
                break
              fi
            done)"
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: Android Gradle project not found."
            echo "Expected settings.gradle + app/build.gradle."
            find "$GITHUB_WORKSPACE" -maxdepth 6 -type f | sort | head -400
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using Android project: $PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Gradle Wrapper 8.9
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Make Gradle wrapper executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vijendra-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
